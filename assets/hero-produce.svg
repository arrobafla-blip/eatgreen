<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Composição de frutas, verduras e legumes frescos</title>
<desc id="desc">Composição ilustrada de folhas verdes, tomates, pimentão amarelo, cenouras, abacate, laranja, pepino e uvas sobre fundo creme e verde.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf2df"/><stop offset="1" stop-color="#dbe8c7"/></linearGradient>
 <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef6"/><stop offset="1" stop-color="#e9e5d1"/></linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75ad55"/><stop offset="1" stop-color="#1e633b"/></linearGradient>
 <linearGradient id="tomato" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f77c50"/><stop offset="1" stop-color="#bd3528"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd06a"/><stop offset="1" stop-color="#ef8d27"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1200" height="800" rx="48" fill="url(#bg)"/>
